version: "3.8"

services:
  windows:
    build: .
    image: docker-win:latest
    container_name: windows
    restart: on-failure

    devices:
      - /dev/kvm

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"      # Web 管理界面 (noVNC)
      - "3389:3389/tcp"  # RDP 远程桌面 (TCP)
      - "3389:3389/udp"  # RDP 远程桌面 (UDP)

    volumes:
      - ./storage:/storage   # 所有数据持久化到当前目录下的 storage/
      - ./shared:/shared   # 如需与宿主机互传文件，取消注释

    environment:
      VERSION: "10l"         # 推荐: 10l (LTSC轻量) 或 10 (完整版)
      RAM_SIZE: "8G"         # 内存分配
      CPU_CORES: "4"         # CPU 核心数
      DISK_SIZE: "64G"       # 虚拟磁盘大小
      LANGUAGE: "Chinese"    # 系统语言
      ENABLE_RDP: "Y"        # 开启远程桌面功能,用户名：docker,密码：admin

    stop_grace_period: 120s
